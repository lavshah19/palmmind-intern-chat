services:
  backend:
    build: ./backend
    container_name: backend-chat
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"

  frontend:
    build: 
      context: ./frontend
      args:
        VITE_API_URL: http://44.203.22.75:5000/api
        VITE_SOCKET_URL: http://44.203.22.75:5000
    container_name: frontend-chat
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend