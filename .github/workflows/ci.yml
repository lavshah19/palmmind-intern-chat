# Name of the workflow (shown in GitHub Actions UI)
name: build-and-lint

# WHEN this workflow  runs
on:
  # Runs when code is pushed to these branches
  push:
    branches: [main, dev]

  # Runs when a pull request targets these branches
  pull_request:
    branches: [main, dev]

# JOBS = group of steps that run on a machine
jobs:
  build-and-lint:

    # Operating system machine provided by GitHub
    runs-on: ubuntu-latest

    # STEPS = individual tasks inside this job (run one by one)
    steps:

      # STEP 1: Download your repository code into the VM
      - name: Checkout repo
        uses: actions/checkout@v3 
        # use in ci yml to download your code from GitHub into the runner VM
        # Without this, the runner has no project files

      # STEP 2: Install Node.js runtime
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
        # This installs Node.js so npm commands can run

      # STEP 3: Install backend dependencies
      - name: Install backend deps
        working-directory: backend
        run: npm ci
        # npm ci = clean, fast, exact dependency install using package-lock.json

      # STEP 4: Run backend lint checks
      - name: Lint backend
        working-directory: backend
        run: npm run lint -- --max-warnings=0
        # Fails CI if there are ANY warnings or errors in backend code

      # STEP 5: Install frontend dependencies
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
        # Same as backend but for frontend app

      # STEP 6: Run frontend lint checks
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint -- --max-warnings=0
        # Ensures frontend code quality is clean

      # STEP 7: Build backend Docker image
      - name: Build backend Docker image
        run: docker build -t chatbackend ./backend
        # Creates a Docker image for backend app

      # STEP 8: Build frontend Docker image
      - name: Build frontend Docker image
        run: docker build -t chatfrontend ./frontend
        # Creates Docker image for frontend app

  deploy:
    needs: build-and-lint
    if: github.event_name == 'push'
    runs-on: ubuntu-latest  
    steps:
      - name: checkout (optional)
        uses: actions/checkout@v3
      
      - name: Add EC2 host to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}

      - name: Write SSH Key
        run: |
          echo "${EC2_KEY}" > ec2_key.pem
          chmod 600 ec2_key.pem
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}

      - name: Deploy to EC2 (git pull + docker compose up -d --build)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          ssh -i ec2_key.pem "${EC2_USER}@${EC2_HOST}" << EOF
            set -e
            cd "${EC2_APP_DIR}"
            git fetch --all
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
            docker compose ps
          EOF
        # Placeholder for actual deployment commands (e.g., using AWS CLI or CDK)     